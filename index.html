<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaWaze Pro - Otimizador de Entregas</title>
    
    <!-- Importando o Firebase (Versão 13 via Script/CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDukRfUcJd-p5K_1NOBFouZCA0zSe-tQZw",
            authDomain: "minhas-rotas-25084.firebaseapp.com",
            databaseURL: "https://minhas-rotas-25084-default-rtdb.firebaseio.com",
            projectId: "minhas-rotas-25084",
            storageBucket: "minhas-rotas-25084.firebasestorage.app",
            messagingSenderId: "599014840635",
            appId: "1:599014840635:web:68dfbc87233d9b3f1a7f1e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const CHAVES_VALIDAS = ["ROTA123", "CLIENTEIPHONE", "VIP2026"];

        let meuDeviceId = localStorage.getItem('rota_device_id');
        if (!meuDeviceId) {
            meuDeviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem('rota_device_id', meuDeviceId);
        }

        window.onload = function() {
            const licencaSalva = localStorage.getItem('rota_licenca_ativa');
            if (licencaSalva) {
                verificarSessaoAtivaNoBanco(licencaSalva, true);
            }
        };

        window.validarLicenca = async function() {
            const digitada = document.getElementById('chaveInput').value.trim();
            if (!CHAVES_VALIDAS.includes(digitada)) {
                alert('Chave de acesso inválida ou expirada!');
                return;
            }

            const chaveRef = ref(db, 'sessoes/' + digitada);
            const snapshot = await get(chaveRef);

            if (snapshot.exists()) {
                const dadosSessao = snapshot.val();
                if (dadosSessao.deviceId !== meuDeviceId) {
                    alert("⚠️ Esta chave já está em uso ativo em outro aparelho!");
                    return;
                }
            }

            await set(chaveRef, {
                deviceId: meuDeviceId,
                timestamp: Date.now()
            });

            localStorage.setItem('rota_licenca_ativa', digitada);
            mostrarApp();
        };

        async function verificarSessaoAtivaNoBanco(chave, automatico = false) {
            try {
                const chaveRef = ref(db, 'sessoes/' + chave);
                const snapshot = await get(chaveRef);

                if (snapshot.exists()) {
                    const dadosSessao = snapshot.val();
                    if (dadosSessao.deviceId === meuDeviceId) {
                        mostrarApp();
                    } else {
                        if (!automatico) alert("Sessão encerrada por uso em outro aparelho.");
                        sair(false);
                    }
                } else if (!automatico) {
                    sair(false);
                }
            } catch (e) {
                mostrarApp();
            }
        }

        window.sair = async function(removerDoBanco = true) {
            const licencaSalva = localStorage.getItem('rota_licenca_ativa');
            if (removerDoBanco && licencaSalva) {
                const chaveRef = ref(db, 'sessoes/' + licencaSalva);
                await remove(chaveRef).catch(() => {});
            }
            localStorage.removeItem('rota_licenca_ativa');
            location.reload();
        };

        function mostrarApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            renderizarLista();
        }
    </script>

    <!-- Importando Tesseract.js para OCR Otimizado -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --primary: #1a73e8;
            --waze: #33ccff;
            --bg: #f4f6f9;
            --card-bg: #fff;
            --text: #333;
            --danger: #ff4d4d;
            --success: #28a745;
            --camera: #673ab7;
            --voice: #e91e63;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 16px;
            color: var(--text);
        }
        .container { max-width: 480px; margin: 0 auto; }
        h1 { font-size: 1.4rem; text-align: center; color: var(--primary); margin-bottom: 4px; }
        p.subtitle { text-align: center; font-size: 0.85rem; color: #666; margin-top: 0; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
        .btn { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-camera { background-color: var(--camera); color: white; margin-bottom: 8px; }
        .btn-voice { background-color: var(--voice); color: white; margin-bottom: 10px; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-waze { background-color: var(--waze); color: #000; display: block; text-align: center; font-weight: bold; padding: 10px; border-radius: 6px; text-decoration: none; }
        .hidden { display: none !important; }
        .parada-item { background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .header-lista { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .badge-licenca { background: #e6f4ea; color: #137333; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .info-gps { background: #e8f0fe; color: #174ea6; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 10px; text-align: center; }
        .status-otimizacao { font-size: 0.85rem; color: #28a745; text-align: center; margin-bottom: 8px; font-weight: bold; }
        
        .autocomplete-items { 
            border: 1px solid #d4d4d4; 
            border-radius: 8px; 
            z-index: 99; 
            max-height: 140px; 
            overflow-y: auto; 
            background-color: #fff; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            margin-bottom: 10px;
        }
        .autocomplete-items div { 
            padding: 10px; 
            cursor: pointer; 
            background-color: #fff; 
            border-bottom: 1px solid #eee; 
            font-size: 0.9rem; 
        }
        .autocomplete-items div:hover { background-color: #e9e9e9; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="loginScreen" class="card">
            <h1>🔒 RotaWaze Pro</h1>
            <p class="subtitle">Insira sua licença de acesso</p>
            <label for="chaveInput"><strong>Chave de Acesso:</strong></label>
            <input type="password" id="chaveInput" placeholder="Ex: ROTA123">
            <button class="btn btn-primary" onclick="window.validarLicenca()">Entrar no Sistema</button>
        </div>

        <!-- APLICAÇÃO PRINCIPAL -->
        <div id="appScreen" class="hidden">
            <h1>🚗 RotaWaze Pro</h1>
            <div style="text-align: center;">
                <span class="badge-licenca">Licença Ativa ✅</span>
                <a href="#" onclick="window.sair(true)" style="font-size: 0.75rem; color: #d93025; display: block; margin-bottom: 10px;">Sair / Encerrar Sessão</a>
            </div>

            <!-- Bloco para Adicionar Endereços, Câmera e Voz -->
            <div class="card">
                <div class="info-gps">📍 Câmera com filtro inteligente de comanda, Voz e Rota Automática!</div>
                
                <!-- Botões de Ação Rápida -->
                <button class="btn btn-camera" onclick="document.getElementById('inputFotoComanda').click()">📸 Ler Comanda por Foto</button>
                <input type="file" id="inputFotoComanda" accept="image/*" capture="environment" class="hidden" onchange="processarFotoComanda(event)">

                <button class="btn btn-voice" onclick="iniciarReconhecimentoVoz()">🎤 Falar Endereço por Voz</button>

                <label for="enderecoInput" style="margin-top: 4px; display: block;"><strong>Endereço da Entrega (Rua e Número):</strong></label>
                <input type="text" id="enderecoInput" autocomplete="off" placeholder="Ex: Rua Juventus, 832..." oninput="buscarSugestoes(this.value)" onkeydown="if(event.key === 'Enter') { fecharAutocomplete(); adicionarParada(); }">
                
                <div id="autocomplete-list" class="autocomplete-items"></div>

                <button class="btn btn-primary" onclick="adicionarParada()">Adicionar e Otimizar Rota</button>
            </div>

            <!-- Lista de Rotas e Waze -->
            <div>
                <div class="header-lista">
                    <h3 id="contadorTitulo" style="margin: 0; font-size: 1.1rem;">Paradas (0)</h3>
                    <button class="btn btn-danger" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="limparLista()">Limpar Tudo</button>
                </div>
                
                <div id="statusOtimizacao" class="status-otimizacao hidden">🔄 Processando comanda...</div>
                
                <div id="listaParadas" style="margin-top: 12px;"></div>
            </div>
        </div>
    </div>

    <script>
        let enderecos = JSON.parse(localStorage.getItem('enderecos_entrega')) || [];
        let timerAutocomplete = null;

        function salvarEAtualizar() {
            localStorage.setItem('enderecos_entrega', JSON.stringify(enderecos));
            renderizarLista();
        }

        // --- 1. RECONHECIMENTO DE VOZ ---
        window.iniciarReconhecimentoVoz = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("O seu navegador não suporta reconhecimento de voz. Tente usar o Google Chrome no celular.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const statusDiv = document.getElementById('statusOtimizacao');
            statusDiv.innerText = "🎤 Ouvindo endereço... Pode falar!";
            statusDiv.classList.remove('hidden');

            recognition.start();

            recognition.onresult = function(event) {
                const textoFalado = event.results[0][0].transcript;
                document.getElementById('enderecoInput').value = textoFalado;
                statusDiv.classList.add('hidden');
                alert(`✨ Entendido: "${textoFalado}". Clique em Adicionar e Otimizar.`);
            };

            recognition.onerror = function(event) {
                console.error("Erro na voz:", event.error);
                statusDiv.classList.add('hidden');
                alert("Não foi possível capturar a voz. Tente novamente.");
            };

            recognition.onspeechend = function() {
                recognition.stop();
                statusDiv.classList.add('hidden');
            };
        };

        // --- 2. AUTO-PREENCHIMENTO INTELIGENTE ---
        window.buscarSugestoes = function(val) {
            clearTimeout(timerAutocomplete);
            const listaDiv = document.getElementById('autocomplete-list');
            listaDiv.innerHTML = '';

            if (!val || val.length < 3) return;

            timerAutocomplete = setTimeout(async () => {
                try {
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=5`;
                    const resposta = await fetch(url);
                    const dados = await resposta.json();

                    listaDiv.innerHTML = '';
                    dados.forEach(item => {
                        const divItem = document.createElement('div');
                        divItem.innerHTML = item.display_name;
                        
                        divItem.addEventListener('mousedown', function(e) {
                            e.preventDefault();
                            document.getElementById('enderecoInput').value = item.display_name;
                            listaDiv.innerHTML = '';
                        });
                        divItem.appendChild(divItem);
                    });
                } catch (e) {
                    console.error("Erro no auto-preenchimento:", e);
                }
            }, 300);
        };

        window.fecharAutocomplete = function() {
            setTimeout(() => {
                document.getElementById('autocomplete-list').innerHTML = '';
            }, 200);
        };

        // --- 3. LEITURA INTELIGENTE DE COMANDA (FOCADA NO BLOCO DE ENDEREÇO) ---
        window.processarFotoComanda = async function(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const statusDiv = document.getElementById('statusOtimizacao');
            statusDiv.innerText = "⚡ Analisando comanda e isolando o endereço...";
            statusDiv.classList.remove('hidden');

            try {
                const resultado = await Tesseract.recognize(arquivo, 'por');
                const textoExtraido = resultado.data.text;
                console.log("Texto OCR bruto:", textoExtraido);

                const linhas = textoExtraido.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                let enderecoExtraido = "";

                // Procura especificamente pelo termo "ENDERECO" ou "ENDEREÇO"
                for (let i = 0; i < linhas.length; i++) {
                    const lUp = linhas[i].toUpperCase();
                    if (lUp.includes("ENDERECO") || lUp.includes("ENDEREÇO") || lUp.includes("END.")) {
                        // Captura as próximas linhas úteis ignorando traços isolados ou palavras curtas vazias
                        let pedacos = [];
                        for (let j = 1; j <= 3; j++) {
                            if (i + j < linhas.length) {
                                let proximaLinha = linhas[i + j];
                                // Se a linha seguinte for o começo de outra seção (ex: "Qtde", "Telefone", etc), para.
                                if (proximaLinha.toUpperCase().includes("QTDE") || 
                                    proximaLinha.toUpperCase().includes("TELEFONE") || 
                                    proximaLinha.toUpperCase().includes("CLIENTE") ||
                                    proximaLinha === "-") {
                                    break;
                                }
                                if (proximaLinha.length > 2) {
                                    pedacos.push(proximaLinha);
                                }
                            }
                        }
                        if (pedacos.length > 0) {
                            enderecoExtraido = pedacos.join(", ");
                            break;
                        }
                    }
                }

                // Se não achou pela palavra ENDERECO, busca linhas que contenham termos típicos de rua
                if (!enderecoExtraido) {
                    for (let linha of linhas) {
                        let lUp = linha.toUpperCase();
                        if (lUp.includes("RUA ") || lUp.includes("AV ") || lUp.includes("AVENIDA ") || lUp.includes("ALAMEDA ")) {
                            enderecoExtraido = linha;
                            break;
                        }
                    }
                }

                // Limpa possíveis caracteres indesejados nas pontas
                enderecoExtraido = enderecoExtraido.replace(/^[-–—,\s]+/, "").trim();

                document.getElementById('enderecoInput').value = enderecoExtraido;
                statusDiv.classList.add('hidden');

                if (enderecoExtraido) {
                    alert(`✨ Endereço isolado: "${enderecoExtraido}". Confira se está correto e clique em Adicionar.`);
                } else {
                    alert("Não foi possível isolar o endereço com precisão. Por favor, digite ou use o microfone.");
                }
            } catch (erro) {
                console.error("Erro no OCR:", erro);
                alert("Erro ao ler a foto da comanda.");
                statusDiv.classList.add('hidden');
            } finally {
                event.target.value = '';
            }
        };

        async function gearEndereco(endereco) {
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco)}&limit=1`;
                const resposta = await fetch(url);
                const dados = await resposta.json();
                if (dados && dados.length > 0) {
                    return { lat: parseFloat(dados[0].lat), lon: parseFloat(dados[0].lon) };
                }
            } catch (e) {
                console.error("Erro ao buscar coordenadas:", e);
            }
            return null;
        }

        function obterLocalizacaoAtual() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject("GPS não suportado.");
                } else {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                lat: position.coords.latitude,
                                lon: position.coords.longitude
                            });
                        },
                        (error) => {
                            reject("Erro no GPS.");
                        },
                        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                    );
                }
            });
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            const R = 6371;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        window.adicionarParada = async function() {
            const input = document.getElementById('enderecoInput');
            const valor = input.value.trim();
            if (!valor) {
                alert('Digite ou escaneie um endereço válido.');
                return;
            }

            document.getElementById('autocomplete-list').innerHTML = '';
            enderecos.push(valor);
            input.value = '';
            salvarEAtualizar();

            if (enderecos.length >= 2) {
                const statusDiv = document.getElementById('statusOtimizacao');
                statusDiv.innerText = "🔄 Otimizando rota por proximidade...";
                statusDiv.classList.remove('hidden');

                try {
                    let pontoAtual;
                    try {
                        pontoAtual = await obterLocalizacaoAtual();
                    } catch (e) {
                        const coordsPrimeira = await gearEndereco(enderecos[0]);
                        pontoAtual = coordsPrimeira ? { lat: coordsPrimeira.lat, lon: coordsPrimeira.lon } : null;
                    }

                    let pontos = [];
                    for (let i = 0; i < enderecos.length; i++) {
                        const coords = await gearEndereco(enderecos[i]);
                        pontos.push({
                            endereco: enderecos[i],
                            lat: coords ? coords.lat : null,
                            lon: coords ? coords.lon : null
                        });
                    }

                    let validos = pontos.filter(p => p.lat !== null);
                    let invalidos = pontos.filter(p => p.lat === null).map(p => p.endereco);

                    if (validos.length >= 2 && pontoAtual) {
                        let rotaOtimizada = [];
                        let atual = pontoAtual;

                        while (validos.length > 0) {
                            let maisProximoIndex = 0;
                            let menorDistancia = Infinity;

                            for (let i = 0; i < validos.length; i++) {
                                const dist = calcularDistancia(atual.lat, atual.lon, validos[i].lat, validos[i].lon);
                                if (dist < menorDistancia) {
                                    menorDistancia = dist;
                                    maisProximoIndex = i;
                                }
                            }

                            let escolhido = validos.splice(maisProximoIndex, 1)[0];
                            rotaOtimizada.push(escolhido.endereco);
                            atual = { lat: escolhido.lat, lon: escolhido.lon };
                        }

                        enderecos = [...rotaOtimizada, ...invalidos];
                        salvarEAtualizar();
                    }
                } catch (err) {
                    console.error("Erro na otimização automática:", err);
                } finally {
                    statusDiv.classList.add('hidden');
                }
            }
        }

        window.removerParada = function(index) {
            enderecos.splice(index, 1);
            salvarEAtualizar();
        }

        window.limparLista = function() {
            if (confirm('Deseja apagar todas as paradas?')) {
                enderecos = [];
                salvarEAtualizar();
            }
        }

        function renderizarLista() {
            const container = document.getElementById('listaParadas');
            const contador = document.getElementById('contadorTitulo');
            container.innerHTML = '';
            contador.innerText = `Paradas (${enderecos.length})`;

            if (enderecos.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #888; font-size: 0.9rem;">Nenhuma parada cadastrada.</p>';
                return;
            }

            enderecos.forEach((end, index) => {
                const encodedEnd = encodeURIComponent(end);
                const wazeUrl = `https://waze.com/ul?q=${encodedEnd}&navigate=yes`;

                const div = document.createElement('div');
                div.className = 'parada-item';
                div.innerHTML = `
                    <div style="font-size: 0.95rem; font-weight: 500;">
                        <strong>Parada ${index + 1}:</strong> ${end}
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <a href="${wazeUrl}" class="btn-waze" style="flex: 2;">Abrir no Waze 🚗</a>
                        <button class="btn btn-danger" style="flex: 1; margin-top: 0; padding: 10px;" onclick="removerParada(${index})">Excluir</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
